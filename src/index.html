<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tiny Room</title>
  </head>

  <body>
    <div class=""></div>

    <div class="loadingPage">
      <div class="loadingPageCenter">
        <div class="loadingPageTop">
          <p class="loadingText" id="loadingText"></p>
          <button class="enter" id="enterButton">Enter with Sound</button>
        </div>

        <button class="withoutEnter" id="withoutEnterButton">
          Enter without Sound : (
        </button>
      </div>
    </div>

    <div class="navbar">
      <div class="nav-Logo">
        <h1 class="logo-first">M</h1>
        <h1 class="logo-second">I</h1>
        <h1 class="logo-third">A</h1>
      </div>
      <div class="navCenter">
        <button class="nav-button">About</button>
        <button class="nav-button">Contact</button>
      </div>
      <div class="navright">
        <button class="nav-button">Sound On</button>
        <button id="themeToggle" class="theme-toggle">
          <div id="toggleHandle" class="toggle-handle">
            <!-- Gündüz PNG -->
            <img
              src="./icons/sunblack.png"
              id="iconSun"
              class="toggle-icon"
              alt="Sun"
            />
            <!-- Gece PNG -->
            <img
              src="./icons/moon.png"
              id="iconMoon"
              class="toggle-icon"
              alt="Moon"
            />
          </div>
        </button>
      </div>
    </div>

    <div id="experience">
      <canvas class="webgl"></canvas>
    </div>
  </body>

  <script type="module" src="script.js"></script>
  <script type="module" src="buttons.js"></script>
</html>
